<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EatMeowever Demo</title>
<meta name="description" content="Can't decide where to eat? The cat prints you an order ticket for a place nearby. California only, nothing saved.">
<meta name="theme-color" content="#FFF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191321" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="name-serif.css">
<script src="config.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="paw" viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="5" ry="4.2"/><ellipse cx="5.5" cy="10" rx="2" ry="2.6"/><ellipse cx="9.5" cy="6" rx="2" ry="2.6"/><ellipse cx="14.5" cy="6" rx="2" ry="2.6"/><ellipse cx="18.5" cy="10" rx="2" ry="2.6"/></symbol></svg>
<div class="app">
<header class="hdr">
  <div class="brand"><b lang="zh-Hans">吃什喵</b><small>EatMeowever · Demo</small></div>
  <div class="tr"><button id="filter-btn" class="ib fl" aria-haspopup="dialog" data-i="filters" data-attr="aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span class="fdot" id="fdot" hidden></span></button>
  <button id="set-btn" class="ib" aria-haspopup="dialog" data-i="settings" data-attr="aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.5h3.4l.5 2.6 1.6.9 2.5-.9 1.7 2.9-2 1.7v1.9l2 1.7-1.7 2.9-2.5-.9-1.6.9-.5 2.6h-3.4l-.5-2.6-1.6-.9-2.5.9-1.7-2.9 2-1.7v-1.9l-2-1.7 1.7-2.9 2.5.9 1.6-.9z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
</header>
<main>
<section id="view-choose" class="view" aria-labelledby="h-choose">
  <div class="hero">
    <h1 id="h-choose" class="ht" data-i="title"></h1>
    <p class="sub" data-i="subtitle"></p>
  </div>
  <div class="pile" id="pile" role="region" data-i="pile" data-attr="aria-label">
    <div class="pe" id="pile-empty"><svg class="pe-ico" id="pe-ico" viewBox="0 0 24 24" aria-hidden="true" hidden><use href="#paw"/></svg><b id="pe-t"></b>
      <button class="go" id="start-btn" type="button" aria-describedby="pe-s"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#paw"/></svg><span></span></button>
      <span class="pe-s" id="pe-s"></span></div>
  </div>
  <div class="prn" id="counter">
    <svg class="pbody" id="pbody" aria-hidden="true"></svg>
    <div class="lcd" aria-live="polite"><span id="lcd-n"><span id="lcd-pre"></span> <b id="count">0</b> <span id="lcd-post"></span></span><span id="lcd-msg" hidden></span><i class="led" aria-hidden="true"></i></div>
    <button id="ccat" class="ccat" data-i="petCat" data-attr="aria-label"></button>
    <span class="bubble stk" id="bubble" hidden></span>
    <span class="zzz" aria-hidden="true"><i style="--n:0">z</i><i style="--n:1">z</i><i style="--n:2">z</i></span>
  </div>
  <div class="ctrl away" id="ctrl">
    <p class="hint" id="hint" aria-live="polite"></p>
    <button class="rnd" id="pick-btn" data-i="rerollLabel" data-attr="aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v5h-5"/></svg><span id="pick-lbl"></span></button>
    <button class="pick ok" id="ok-btn" data-i="chooseLabel" data-attr="aria-label" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="ok-lbl" data-i="choose"></span></button>
    <button class="rnd" id="look-btn" data-i="lookLabel" data-attr="aria-label" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><span data-i="look"></span></button>
  </div>
</section>
</main>
<p class="credits"><a href="about/" data-i="about"></a> · <span data-i="credit"></span> <a href="https://overturemaps.org" target="_blank" rel="noopener">Overture Maps Foundation</a> (<span id="release"></span>) · <a href="https://github.com/kennyufish/eat-meowever-demo#data-and-credits" target="_blank" rel="noopener" data-i="creditsLink"></a><br><span data-i="zhCredit"></span><br><span data-i="caveat"></span><br><span data-i="privacy"></span></p>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden>
  <div class="scrim" data-close></div>
  <div class="spanel" id="spanel"><div class="grab" aria-hidden="true"></div><div id="sheet-body"></div></div>
</div>
<div class="skipper" id="skipper" aria-hidden="true" hidden></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>
</body>
</html>
